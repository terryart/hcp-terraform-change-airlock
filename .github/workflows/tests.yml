name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile handler
        run: python -m py_compile handlers/handler.py
      - name: Run unit and governance tests
        run: python -m unittest discover -s tests -v
      - name: Validate manifest JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("module.json").read_text(encoding="utf-8"))
          assert manifest["manifest_version"] == 2
          assert len(manifest["commands"]) == 10
          assert all(c.get("preview") is True for c in manifest["commands"])
          assert all(c.get("receipt_required") is True for c in manifest["commands"])
          writes = [c for c in manifest["commands"] if c["mode"] == "write_requires_approval"]
          assert len(writes) == 6
          print("manifest governance invariants: ok")
          PY
